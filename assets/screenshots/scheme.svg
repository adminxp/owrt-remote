<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#020617" flood-opacity=".35"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker>
  <style>
    .label{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#fff;text-anchor:middle}
    .small{font-family:Inter,Arial,sans-serif;font-size:17px;fill:#cbd5e1;text-anchor:middle}
    .line{fill:none;stroke:#94a3b8;stroke-width:3;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1200" height="470" rx="28" fill="url(#bg)"/>
<text x="600" y="48" class="label" font-size="28">OpenWrt Remote Hub — схема работы</text>
<text x="600" y="78" class="small">Без прямого открытия LuCI и SSH роутера в интернет</text>
<g filter="url(#shadow)">
  <rect x="45" y="155" width="205" height="95" rx="18" fill="url(#blue)"/>
  <rect x="310" y="155" width="205" height="95" rx="18" fill="url(#purple)"/>
  <rect x="575" y="155" width="205" height="95" rx="18" fill="url(#orange)"/>
  <rect x="840" y="155" width="205" height="95" rx="18" fill="url(#blue)"/>
  <rect x="930" y="325" width="210" height="82" rx="16" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <rect x="650" y="325" width="210" height="82" rx="16" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
</g>
<path class="line" d="M250 202 H300"/>
<path class="line" d="M515 202 H565"/>
<path class="line" d="M780 202 H830"/>
<path class="line" d="M942 250 V290 H755 V315"/>
<path class="line" d="M1040 250 V315"/>
<text x="147" y="193" class="label" font-size="21">Браузер</text><text x="147" y="221" class="small">HTTPS :443</text>
<text x="412" y="193" class="label" font-size="21">nginx на VPS</text><text x="412" y="221" class="small">TLS / reverse proxy</text>
<text x="677" y="193" class="label" font-size="21">Hub-панель</text><text x="677" y="221" class="small">OpenWrt Remote Hub</text>
<text x="942" y="193" class="label" font-size="21">OpenWrt роутер</text><text x="942" y="221" class="small">Xray Reverse-туннель</text>
<text x="1035" y="358" class="label" font-size="20">LuCI</text><text x="1035" y="383" class="small">веб-интерфейс</text>
<text x="755" y="358" class="label" font-size="20">SSH / Dropbear</text><text x="755" y="383" class="small">терминал в браузере</text>
<text x="600" y="445" class="small">Роутер сам устанавливает исходящее соединение с VPS</text>
</svg>